name: Atualização Diária

on:
  schedule:
    # 18h BRT = 21:00 UTC
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Instalar dependências
        run: |
          pip install yfinance pandas
          pip install reportlab openpyxl
      
      - name: Baixar dados
        run: |
          python baixar_dados.py
      
      - name: Calcular scores
        run: |
          python calcular_scores.py
          python calcular_momentum.py
          python recalcular_scores.py
      
      - name: Gerar relatórios
        run: |
          python gerar_relatorios.py
      
      - name: Copiar dados para output
        run: |
          cp data/scores.json output/
          cp data/fundamentais.json output/
      
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Atualização diária $(date +'%d/%m/%Y')"
          git push
