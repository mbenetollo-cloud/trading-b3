name: Atualização Diária

on:
  schedule:
    # 18h BRT = 21:00 UTC
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Instalar dependências
        run: |
          pip install yfinance pandas requests beautifulsoup4
          pip install reportlab openpyxl
      
      - name: Baixar dados de preço
        run: |
          python baixar_dados.py
      
      - name: Coletar fundamentais
        run: |
          python coletar_fundamentais.py
      
      - name: Calcular momentum
        run: |
          python calcular_momentum.py
      
      - name: Executar fluxo completo
        run: |
          python fluxo_completo.py
      
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Atualização diária $(date +'%d/%m/%Y')"
          git push
